<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#fff5f2">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="おまもりみくじ">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <title>おまもりみくじ</title>
  <style>
    * { box-sizing: border-box; }
    :root {
      --ink:#5c392f; --soft:#85675e; --paper:rgba(255,255,255,.92);
      --line:rgba(186,108,103,.22);
    }
    body {
      margin:0; min-height:100vh; padding:20px 14px 36px; color:var(--ink);
      font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",sans-serif;
      background:
        radial-gradient(circle at 12% 5%,rgba(255,255,255,.95),transparent 28%),
        radial-gradient(circle at 90% 12%,rgba(255,210,214,.5),transparent 26%),
        linear-gradient(160deg,#fffaf5,#fff0ed);
    }
    .app { width:min(100%,520px); margin:0 auto; }
    .entrance {
      display:block; width:100%; margin:0; padding:0; border:0; background:transparent;
      cursor:pointer; border-radius:28px; overflow:hidden;
      box-shadow:0 16px 36px rgba(113,66,53,.12);
    }
    .entrance img { display:block; width:100%; height:auto; }
    .entrance:active { transform:scale(.995); }
    .result-card {
      display:none; margin-top:17px; padding:20px 17px; text-align:center;
      border:1px solid var(--line); border-radius:28px; background:var(--paper);
      box-shadow:0 16px 36px rgba(113,66,53,.12);
    }
    .result-card.show { display:block; animation:appear .45s ease both; }
    @keyframes appear {
      from { opacity:0; transform:translateY(10px); }
      to { opacity:1; transform:translateY(0); }
    }
    .result-label {
      margin: 0 0 12px;
      color:var(--soft); font-size:14px; letter-spacing:.12em;
    }
    .rank, .reading { display:none; }

    .fortune-wrap {
      position:relative;
      width:100%;
      max-width:440px;
      margin:0 auto 17px;
    }
    .fortune-image {
      display:block; width:100%; margin:0;
      border-radius:18px; box-shadow:0 9px 22px rgba(98,60,49,.13);
    }

    /* 完成画像内の3つの空欄に結果を重ねる */
    .image-detail {
      position:absolute;
      left:9.5%;
      width:81%;
      text-align:left;
      color:#5c392f;
      font-weight:700;
      font-size:clamp(12px,3.4vw,17px);
      line-height:1.25;
      pointer-events:none;
      padding-left:3%;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .image-color  { top:72.2%; }
    .image-action { top:80.2%; }
    .image-item   { top:88.2%; }

    /* 画像に既に枠があるため、下の重複カードは表示しない */
    .details { display:none !important; }
    .message {
      margin:10px 2px 18px; font-family:"Yu Mincho","Hiragino Mincho ProN",serif;
      font-size:17px; line-height:1.9;
    }
    .details { display:grid; grid-template-columns:1fr 1fr; gap:10px; text-align:left; }
    .detail {
      min-height:98px; padding:13px; border:1px solid rgba(186,108,103,.14);
      border-radius:16px; background:#fff6f3;
    }
    .detail.action { grid-column:1/-1; min-height:auto; }
    .detail-label { margin-bottom:7px; color:var(--soft); font-size:12px; }
    .detail-value { line-height:1.6; font-weight:700; }
    button.share {
      width:100%; min-height:60px; margin-top:15px; border-radius:999px;
      padding:13px 20px; font:inherit; font-size:18px; font-weight:700;
      letter-spacing:.07em; cursor:pointer; color:var(--ink); background:white;
      border:1px solid var(--line);
    }
    #shareStatus { min-height:1.5em; margin:8px 0 0; color:var(--soft); font-size:12px; }
    footer { margin-top:18px; text-align:center; color:var(--soft); font-size:12px; line-height:1.7; }
    @media(max-width:380px) {
      .details { grid-template-columns:1fr; }
      .detail.action { grid-column:auto; }
    }
  </style>
</head>
<body>
<main class="app">
  <button class="entrance" id="entrance" type="button" aria-label="今日のおまもりを見る">
    <img src="./omamori-top.png" alt="おまもりみくじ。巫女ねこ・ちゃろまるとピーちゃん">
  </button>

  <section class="result-card" id="resultCard" aria-live="polite">
    <div class="result-label">今日のおまもり</div>
    <div class="rank" id="rank"></div>
    <div class="reading" id="reading"></div>
    <div class="fortune-wrap">
      <img class="fortune-image" id="fortuneImage" src="" alt="">
      <div class="image-detail image-color" id="imageColor"></div>
      <div class="image-detail image-action" id="imageAction"></div>
      <div class="image-detail image-item" id="imageItem"></div>
    </div>
    <p class="message" id="message"></p>
    <div class="details">
      <div class="detail">
        <div class="detail-label">ラッキーカラー</div>
        <div class="detail-value" id="color"></div>
      </div>
      <div class="detail">
        <div class="detail-label">ラッキーアイテム</div>
        <div class="detail-value" id="item"></div>
      </div>
      <div class="detail action">
        <div class="detail-label">今日のおまもり行動</div>
        <div class="detail-value" id="action"></div>
      </div>
    </div>
    <button class="share" id="shareBtn" type="button">このおまもりを共有する</button>
    <p id="shareStatus"></p>
  </section>

  <footer>
    未来を決める占いではなく、今日を少しやさしくするおまもりです。<br>
    © ちゃろまる神社
  </footer>
</main>

<script>
"use strict";

const fortunes = [
  {
    name:"神吉", reading:"かみきち", image:"./kamikichi.png",
    messages:["今日は、不思議なくらい物事が味方してくれそう。焦らず、心が向くほうへ進んでみて。","小さな願いが動き始める日。自分の直感を、いつもより少し信じてみよう。"],
    colors:["桜色","白","金色"], items:["小さなお守り","お気に入りのアクセサリー","温かい飲み物"],
    actions:["一番大切なことを一つだけ決める","空を見上げて深呼吸する","心に浮かんだことをメモする"]
  },
  {
    name:"嬉吉", reading:"うれきち", image:"./urekichi.png",
    messages:["思わず笑顔になる出来事が見つかりそう。嬉しい気持ちは、遠慮せず受け取って。","今日の喜びは、小さなところに隠れています。好きなことに目を向けてみよう。"],
    colors:["みかん色","桃色","黄色"], items:["甘いお菓子","好きな音楽","明るい色のハンカチ"],
    actions:["嬉しかったことを一つ言葉にする","好きな曲を一曲聴く","自分に小さなご褒美をあげる"]
  },
  {
    name:"福吉", reading:"ふくきち", image:"./fukukichi.png",
    messages:["いつもの一日の中に、小さな幸せがいくつも見つかりそう。ゆっくり味わって。","足元にある福に気づける日。無理に急がず、心地よいペースで過ごそう。"],
    colors:["空色","クリーム色","淡い緑"], items:["お気に入りのカップ","柔らかいタオル","季節の食べ物"],
    actions:["温かいものをゆっくり飲む","身の回りを一か所だけ整える","今日よかったことを三つ探す"]
  },
  {
    name:"強吉", reading:"つよきち", image:"./tsuyokichi.png",
    messages:["荒ぶる力の中にも、あなたを守る強さがある日。焦らず一歩ずつ進んでみて。","今のあなたには、新しい道を切りひらく力があります。小さな一歩を大切に。"],
    colors:["紺色","白","金色"], items:["お気に入りの靴","小さなノート","鍵"],
    actions:["後回しにしていたことを一つ始める","背筋を伸ばして歩く","今日やることを一つに絞る"]
  },
  {
    name:"優吉", reading:"やさきち", image:"./yasakichi.png",
    messages:["今日は自分にも人にも、少しやさしくできる日。完璧でなくて大丈夫。","やさしさは弱さではなく、今日を守る力です。まずは自分をいたわってあげよう。"],
    colors:["藤色","薄桃色","ミルク色"], items:["柔らかいブランケット","香りのよいもの","お気に入りの本"],
    actions:["自分を責める言葉を一つ手放す","いつもより少し早く休む","頑張った自分を褒める"]
  }
];

const STORAGE_KEY = "omamori-mikuji-kaminyanzu-v8";
const $ = id => document.getElementById(id);
const randomFrom = array => array[Math.floor(Math.random()*array.length)];

function dateKey(){
  const d=new Date();
  return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`;
}
function makeFortune(){
  const base=randomFrom(fortunes);
  return {date:dateKey(),name:base.name,reading:base.reading,image:base.image,
    message:randomFrom(base.messages),color:randomFrom(base.colors),
    item:randomFrom(base.items),action:randomFrom(base.actions)};
}
function saveFortune(f){
  try{ localStorage.setItem(STORAGE_KEY,JSON.stringify(f)); }catch(_){}
}
function loadFortune(){
  try{
    const v=localStorage.getItem(STORAGE_KEY);
    if(!v)return null;
    const f=JSON.parse(v);
    return f.date===dateKey()?f:null;
  }catch(_){return null;}
}
function currentFortune(){
  const saved=loadFortune();
  if(saved)return saved;
  const created=makeFortune(); saveFortune(created); return created;
}
function showFortune(f,scroll=true){
  $("rank").textContent=f.name;
  $("reading").textContent=`（${f.reading}）`;
  $("fortuneImage").src=f.image;
  $("fortuneImage").alt=`${f.name}のおまもり`;
  $("message").textContent=f.message;
  $("color").textContent=f.color;
  $("item").textContent=f.item;
  $("action").textContent=f.action;
  $("imageColor").textContent=f.color;
  $("imageAction").textContent=f.action;
  $("imageItem").textContent=f.item;
  $("resultCard").classList.add("show");
  if(scroll) setTimeout(()=>$("resultCard").scrollIntoView({behavior:"smooth",block:"start"}),80);
}
async function shareFortune(){
  const f=loadFortune();
  if(!f){$("shareStatus").textContent="先に今日のおまもりを見てください。";return;}
  const text=`今日のおまもりは「${f.name}（${f.reading}）」でした。\n${f.message}\n#おまもりみくじ #ちゃろまる神社`;
  try{
    if(navigator.share){
      await navigator.share({title:"おまもりみくじ",text,url:location.href});
      $("shareStatus").textContent="共有画面を開きました。";
    }else if(navigator.clipboard&&window.isSecureContext){
      await navigator.clipboard.writeText(`${text}\n${location.href}`);
      $("shareStatus").textContent="共有用の文章をコピーしました。";
    }else{
      window.prompt("以下をコピーして共有してください。",`${text}\n${location.href}`);
      $("shareStatus").textContent="共有用の文章を表示しました。";
    }
  }catch(e){
    if(e&&e.name!=="AbortError")$("shareStatus").textContent="共有できませんでした。もう一度お試しください。";
  }
}
document.addEventListener("DOMContentLoaded",()=>{
  const saved=loadFortune();
  if(saved) showFortune(saved,false);
  $("entrance").addEventListener("click",()=>showFortune(currentFortune(),true));
  $("shareBtn").addEventListener("click",shareFortune);
});
</script>
</body>
</html>
