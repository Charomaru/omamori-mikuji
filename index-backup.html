<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#fff5f2">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="おまもりみくじ">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <title>おまもりみくじ</title>
  <style>
    * { box-sizing: border-box; }

    :root {
      --ink: #5c392f;
      --soft: #85675e;
      --pink: #dc7f86;
      --pink-light: #f4b1b3;
      --paper: rgba(255,255,255,.92);
      --line: rgba(186,108,103,.22);
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 20px 14px 36px;
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
                   "Yu Gothic", "Meiryo", sans-serif;
      background:
        radial-gradient(circle at 12% 5%, rgba(255,255,255,.95), transparent 28%),
        radial-gradient(circle at 90% 12%, rgba(255,210,214,.5), transparent 26%),
        linear-gradient(160deg, #fffaf5, #fff0ed);
    }

    .app {
      width: min(100%, 520px);
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 16px;
    }

    .flower {
      font-size: 27px;
      margin-bottom: 4px;
    }

    h1 {
      margin: 0;
      font-family: "Yu Mincho", "Hiragino Mincho ProN", serif;
      font-size: clamp(36px, 10vw, 54px);
      letter-spacing: .10em;
      line-height: 1.2;
    }

    .subtitle {
      margin: 8px 0 12px;
      color: var(--soft);
      font-size: 14px;
      line-height: 1.7;
    }

    .date {
      display: inline-block;
      padding: 8px 14px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255,255,255,.7);
      color: var(--soft);
      font-size: 13px;
    }

    .main-card,
    .result-card {
      border: 1px solid var(--line);
      border-radius: 28px;
      background: var(--paper);
      box-shadow: 0 16px 36px rgba(113,66,53,.12);
    }

    .main-card {
      padding: 20px 18px 18px;
      text-align: center;
    }

    .welcome {
      margin: 0 0 10px;
      line-height: 1.8;
      font-size: 15px;
    }

    .character {
      display: block;
      width: min(100%, 390px);
      max-height: 420px;
      object-fit: contain;
      margin: 0 auto 4px;
      filter: drop-shadow(0 10px 10px rgba(91,51,42,.15));
    }

    button {
      width: 100%;
      min-height: 60px;
      border: 0;
      border-radius: 999px;
      padding: 13px 20px;
      font: inherit;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: .07em;
      cursor: pointer;
    }

    #drawBtn {
      color: white;
      background: linear-gradient(135deg, var(--pink-light), var(--pink));
      box-shadow: 0 10px 21px rgba(196,89,99,.24);
    }

    button:active {
      transform: scale(.985);
    }

    .notice {
      margin: 10px 0 0;
      color: var(--soft);
      font-size: 12px;
      line-height: 1.6;
    }

    .result-card {
      display: none;
      margin-top: 17px;
      padding: 20px 17px;
      text-align: center;
    }

    .result-card.show {
      display: block;
      animation: appear .45s ease both;
    }

    @keyframes appear {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .result-label {
      color: var(--soft);
      font-size: 13px;
      letter-spacing: .12em;
    }

    .rank {
      margin: 8px 0 0;
      color: #bf554f;
      font-family: "Yu Mincho", "Hiragino Mincho ProN", serif;
      font-size: clamp(48px, 15vw, 68px);
      line-height: 1.1;
      letter-spacing: .09em;
    }

    .reading {
      margin: 4px 0 16px;
      color: var(--soft);
      font-size: 14px;
    }

    .fortune-image {
      display: block;
      width: 100%;
      max-width: 440px;
      margin: 0 auto 17px;
      border-radius: 18px;
      box-shadow: 0 9px 22px rgba(98,60,49,.13);
    }


    .fortune-wrap {
      position: relative;
      width: 100%;
      max-width: 440px;
      margin: 0 auto 17px;
    }

    .fortune-wrap .fortune-image {
      margin: 0;
    }

    .card-lucky {
      position: absolute;
      left: 9%;
      right: 9%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 10px;
      color: #5c392f;
      font-weight: 700;
      font-size: clamp(13px, 4vw, 18px);
      line-height: 1.35;
      text-align: center;
      pointer-events: none;
    }

    /* 新しい縦長カード画像の空欄位置 */
    .card-lucky.color  { top: 73.0%; height: 5.3%; }
    .card-lucky.action { top: 81.2%; height: 5.3%; }
    .card-lucky.item   { top: 89.2%; height: 5.3%; }

    .message {
      margin: 10px 2px 18px;
      font-family: "Yu Mincho", "Hiragino Mincho ProN", serif;
      font-size: 17px;
      line-height: 1.9;
    }

    .details {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      text-align: left;
    }

    .detail {
      min-height: 98px;
      padding: 13px;
      border: 1px solid rgba(186,108,103,.14);
      border-radius: 16px;
      background: #fff6f3;
    }

    .detail.action {
      grid-column: 1 / -1;
      min-height: auto;
    }

    .detail-label {
      margin-bottom: 7px;
      color: var(--soft);
      font-size: 12px;
    }

    .detail-value {
      line-height: 1.6;
      font-weight: 700;
    }

    #shareBtn {
      margin-top: 15px;
      color: var(--ink);
      background: white;
      border: 1px solid var(--line);
    }

    #shareStatus {
      min-height: 1.5em;
      margin: 8px 0 0;
      color: var(--soft);
      font-size: 12px;
    }

    footer {
      margin-top: 18px;
      text-align: center;
      color: var(--soft);
      font-size: 12px;
      line-height: 1.7;
    }

    @media (max-width: 380px) {
      .details { grid-template-columns: 1fr; }
      .detail.action { grid-column: auto; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <div class="flower" aria-hidden="true">🌸</div>
      <h1>おまもりみくじ</h1>
      <p class="subtitle">ちゃろまる神社から、今日のあなたへ<br>小さなおまもりをお届けします。</p>
      <div class="date" id="today"></div>
    </header>

    <section class="main-card">
      <p class="welcome">巫女ねこ・ちゃろまるとピーちゃんが<br>やさしい吉を選びます。</p>
      <img class="character" src="./omamori-top.png" alt="巫女ねこ・ちゃろまるとピーちゃんのおまもりみくじ">
      <button id="drawBtn" type="button">今日のおまもりをひく</button>
      <p class="notice">どのおまもりも順位ではありません。<br>今日のあなたに合う、五つの祝福のひとつです。</p>
    </section>

    <section class="result-card" id="resultCard" aria-live="polite">
      <div class="result-label">今日のおまもり</div>
      <div class="rank" id="rank"></div>
      <div class="reading" id="reading"></div>
      <div class="fortune-wrap">
        <img class="fortune-image" id="fortuneImage" src="" alt="">
        <div class="card-lucky color" id="cardColor"></div>
        <div class="card-lucky action" id="cardAction"></div>
        <div class="card-lucky item" id="cardItem"></div>
      </div>
      <p class="message" id="message"></p>

      <button id="shareBtn" type="button">このおまもりを共有する</button>
      <p id="shareStatus"></p>
    </section>

    <footer>
      未来を決める占いではなく、今日を少しやさしくするおまもりです。<br>
      © Charomaru
    </footer>
  </main>

  <script>
    "use strict";

    const fortunes = [
      {
        name: "神吉",
        reading: "かみきち",
        deity: "アマテラにゃん",
        image: "./kamikichi.png",
        messages: [
          "あたたかな光の中に、新しいはじまりがある。新しい一歩を、明るい気持ちで進んでみよう。",
          "今日は心に光が差し込みそう。小さな一歩を、自分らしく踏み出してみて。"
        ],
        colors: ["桜色", "白", "金色", "朱色", "クリーム色"],
        items: ["ハンカチ", "お気に入りのペン", "小さな鏡", "マグカップ", "ノート"],
        actions: ["朝の光を浴びる", "今日やりたいことを一つ決める", "背筋を伸ばして歩く", "机の上を少し整える", "笑顔であいさつする"]
      },
      {
        name: "優吉",
        reading: "やさきち",
        deity: "ツクヨミにゃん",
        image: "./yasakichi.png",
        messages: [
          "静けさの中に、新しいひらめきが宿る。あなたの心を整え、やさしい夜の光に身をゆだねて。",
          "急がなくても大丈夫。今日は少し静かな時間をつくると、心がすっと整いそう。"
        ],
        colors: ["藤色", "水色", "銀色", "紺色", "薄紫"],
        items: ["ハンドクリーム", "お気に入りの本", "イヤホン", "マグカップ", "柔らかいタオル"],
        actions: ["深呼吸を三回する", "寝る前に5分ゆっくりする", "温かい飲み物を飲む", "空を見上げる", "少し早めに休む"]
      },
      {
        name: "強吉",
        reading: "つよきち",
        deity: "スサノオにゃん",
        image: "./tsuyokichi.png",
        messages: [
          "荒ぶる力の中にも、守るべき優しさがある。今、あなたの行動が新しい流れを生み出しそう。",
          "迷っていたことに、小さな一歩を。動いてみることで、新しい道が見えてきそう。"
        ],
        colors: ["青", "紺色", "白", "藍色", "銀色"],
        items: ["スニーカー", "腕時計", "折りたたみ傘", "タオル", "ボールペン"],
        actions: ["後回しにしていたことを一つ始める", "いつもより少し速く歩く", "一つだけ決断する", "身の回りを一か所片づける", "元気よくあいさつする"]
      },
      {
        name: "福吉",
        reading: "ふくきち",
        deity: "ダイコクにゃん",
        image: "./fukukichi.png",
        messages: [
          "豊かなご縁と恵みが、あなたのもとに訪れそう。人とのつながりを大切にすると、さらなる幸せが広がります。",
          "身近なところに小さな福が見つかりそう。いつもの一日を、ゆっくり味わってみて。"
        ],
        colors: ["赤", "金色", "生成り色", "橙色", "深緑"],
        items: ["小銭入れ", "エコバッグ", "お弁当箱", "お気に入りのお菓子", "マグカップ"],
        actions: ["財布の中を少し整える", "誰かにありがとうを伝える", "好きなものをゆっくり味わう", "身近な人に声をかける", "今日よかったことを一つ思い出す"]
      },
      {
        name: "嬉吉",
        reading: "うれきち",
        deity: "アメウズにゃん",
        image: "./urekichi.png",
        messages: [
          "笑顔が人の心をひらき、良いご縁や幸運を呼び込みそう。楽しむ気持ちが、思いがけない幸せを連れてきます。",
          "今日は小さな嬉しいことを見つけてみよう。あなたの笑顔が、誰かの笑顔にもつながりそう。"
        ],
        colors: ["桃色", "橙色", "黄色", "赤", "若草色"],
        items: ["ヘアアクセサリー", "ハンカチ", "スマホケース", "好きなお菓子", "イヤホン"],
        actions: ["好きな曲を一曲聴く", "鏡を見て笑顔をつくる", "嬉しかったことを誰かに話す", "お気に入りの服を着る", "楽しい予定を一つ考える"]
      }
    ];

    const STORAGE_KEY = "omamori-mikuji-v5-kaminyanzu";

    const $ = (id) => document.getElementById(id);
    const randomFrom = (array) => array[Math.floor(Math.random() * array.length)];

    function dateKey() {
      const d = new Date();
      return `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`;
    }

    function setToday() {
      const d = new Date();
      $("today").textContent = new Intl.DateTimeFormat("ja-JP", {
        year: "numeric",
        month: "long",
        day: "numeric",
        weekday: "short"
      }).format(d);
    }

    function makeFortune() {
      const base = randomFrom(fortunes);
      return {
        date: dateKey(),
        name: base.name,
        reading: base.reading,
        deity: base.deity,
        image: base.image,
        message: randomFrom(base.messages),
        color: randomFrom(base.colors),
        item: randomFrom(base.items),
        action: randomFrom(base.actions)
      };
    }

    function saveFortune(fortune) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(fortune));
      } catch (_) {}
    }

    function loadFortune() {
      try {
        const value = localStorage.getItem(STORAGE_KEY);
        if (!value) return null;
        const fortune = JSON.parse(value);
        return fortune.date === dateKey() ? fortune : null;
      } catch (_) {
        return null;
      }
    }

    function showFortune(fortune) {
      $("rank").textContent = fortune.name;
      $("reading").textContent = `（${fortune.reading}）`;
      $("fortuneImage").src = fortune.image;
      $("fortuneImage").alt = `${fortune.name}のおまもり`;
      $("message").textContent = fortune.message;
      $("cardColor").textContent = fortune.color;
      $("cardAction").textContent = fortune.action;
      $("cardItem").textContent = fortune.item;
      $("resultCard").classList.add("show");
      $("drawBtn").textContent = "今日のおまもりを見る";
      setTimeout(() => {
        $("resultCard").scrollIntoView({ behavior: "smooth", block: "start" });
      }, 80);
    }

    function currentFortune() {
      const saved = loadFortune();
      if (saved) return saved;
      const created = makeFortune();
      saveFortune(created);
      return created;
    }

    async function shareFortune() {
      const fortune = loadFortune();
      if (!fortune) {
        $("shareStatus").textContent = "先に今日のおまもりをひいてください。";
        return;
      }

      const text =
        `今日のおまもりは「${fortune.name}（${fortune.reading}）」、見守る神にゃんは「${fortune.deity}」でした。` +
        `\n${fortune.message}\n#おまもりみくじ #ちゃろまる神社`;

      try {
        if (navigator.share) {
          await navigator.share({
            title: "おまもりみくじ",
            text: text,
            url: location.href
          });
          $("shareStatus").textContent = "共有画面を開きました。";
        } else if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(`${text}\n${location.href}`);
          $("shareStatus").textContent = "共有用の文章をコピーしました。";
        } else {
          window.prompt("以下をコピーして共有してください。", `${text}\n${location.href}`);
          $("shareStatus").textContent = "共有用の文章を表示しました。";
        }
      } catch (error) {
        if (error && error.name !== "AbortError") {
          $("shareStatus").textContent = "共有できませんでした。もう一度お試しください。";
        }
      }
    }

    document.addEventListener("DOMContentLoaded", () => {
      setToday();

      const saved = loadFortune();
      if (saved) {
        showFortune(saved);
      }

      $("drawBtn").addEventListener("click", () => {
        showFortune(currentFortune());
      });

      $("shareBtn").addEventListener("click", shareFortune);
    });
  </script>
</body>
</html>
